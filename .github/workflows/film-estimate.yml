name: Estimate Lemay film cost

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [media/film-estimate-trigger.txt]

permissions:
  contents: write

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Estimate cost without generating media
        env:
          HF_CREDENTIALS: ${{ secrets.HF_CREDENTIALS }}
        run: node scripts/create-property-film.mjs --estimate
      - name: Save estimate for review
        if: always()
        run: |
          if [ -f site/assets/media/cost-estimate.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/assets/media/cost-estimate.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save property film cost estimate'
              git push origin "HEAD:refs/heads/generated/lemay-estimate-${GITHUB_RUN_ID}"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lemay-film-estimate
          path: site/assets/media/cost-estimate.json
          if-no-files-found: ignore
